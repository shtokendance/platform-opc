<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 OPC 管理后台</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 3rem auto; padding: 0 1rem; max-width: 30rem; }
  input, button { font: inherit; padding: .55rem; }
  input { width: 100%; box-sizing: border-box; margin: .5rem 0 1rem; }
</style>
<h1>登录 OPC 管理后台</h1>
<form id="login">
  <label for="token">管理员访问令牌</label>
  <input id="token" type="password" autocomplete="off" required>
  <button>登录</button>
  <p role="alert" id="error"></p>
</form>
<script>
  const form = document.querySelector('#login');
  const input = document.querySelector('#token');
  const error = document.querySelector('#error');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    error.textContent = '';
    try {
      const response = await fetch('/admin/session', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + input.value.trim() },
      });
      input.value = '';
      if (!response.ok) throw new Error('管理员令牌无效、过期或未获授权。');
      location.replace('/admin/deploy');
    } catch (failure) {
      error.textContent = failure.message;
    }
  });
</script>
</html>
